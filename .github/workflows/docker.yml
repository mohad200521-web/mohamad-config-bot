name: Build and Run Telegram Bot

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build-and-run:
runs-on: ubuntu-latest
timeout-minutes: 350

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build and Push
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: ${{ secrets.DOCKERHUB_USERNAME }}/mohamad:latest

  - name: Run Telegram Bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_ID: ${{ secrets.GROUP_ID }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      POST_INTERVAL: "3600"
    run: |
      docker build -t mohamad-bot .
      docker run --rm \
        -e BOT_TOKEN \
        -e GROUP_ID \
        -e ADMIN_ID \
        -e POST_INTERVAL \
        mohamad-bot