name: Run Telegram Config Bot

on:
workflow_dispatch:
push:
branches:
- main

jobs:
run-bot:
runs-on: ubuntu-latest
timeout-minutes: 350

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build Docker image
    run: docker build -t mohamad-bot .

  - name: Run Telegram bot
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_ID: ${{ secrets.GROUP_ID }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      POST_INTERVAL: "3600"
    run: |
      docker run --rm \
        -e BOT_TOKEN \
        -e GROUP_ID \
        -e ADMIN_ID \
        -e POST_INTERVAL \
        mohamad-bot